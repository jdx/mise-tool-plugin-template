[env]
MISE_USE_VERSIONS_HOST = "0"
# Temporary workaround for LuaRocks 3.13.0's broken official source tarball.
# Remove after luarocks/luarocks publishes a fixed release.
ASDF_LUA_LUAROCKS_VERSION = "3.12.2"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.4"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]
